<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WGKF Secretariat – Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Libre+Baskerville&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/secretariat.css">
</head>

<body>

<main class="dashboard-wrapper">

  <header class="system-header">
  <h1>WGKF Secretariat</h1>
  <p>Official Notice Management System</p>
  <p id="userRole" class="role-badge"></p>
</header>



  <section class="dashboard-section">

  <button class="primary-action" onclick="goTo('notices.html')">
    Issue New Notice
  </button>

</section>

<section class="dashboard-section">

  <h2>Quick Actions</h2>

 <div class="dashboard-card" data-go="announcements.html">
    <h3>📢 Announcements</h3>
    <p>Handwritten running ribbon messages</p>
  </div>
<div class="dashboard-card super-only" data-go="announcements-approval.html">
  <h3>✅ Approvals</h3>
  <p>Announcements awaiting decision</p>
</div>


</section>


  <section class="dashboard-section">

    <h2>Records</h2>

    <button class="secondary-action" onclick="goTo('notices.html#scheduled')">
      Scheduled Notices
    </button>

    <button class="secondary-action" onclick="goTo('notices.html#active')">
      Active Notices
    </button>

    <button class="secondary-action" onclick="goTo('notices.html#archive')">
      Archive (View Only)
    </button>

  </section>

  <section class="dashboard-section muted">

    <h2>Media (Coming Soon)</h2>

    <button class="disabled-action" disabled>
      Photo Gallery
    </button>

    <button class="disabled-action" disabled>
      Short Videos
    </button>

  </section>

  <footer class="dashboard-footer">
    <button class="logout" onclick="logout()">Logout</button>
  </footer>

</main>

<script type="module" src="js/dashboard.js"></script>
</body>
</html>
