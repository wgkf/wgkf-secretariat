<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WGKF Secretariat – Announcement Approvals</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Libre+Baskerville&display=swap" rel="stylesheet">

  <style>
    /* ================= BASE ================= */
    body {
      margin: 0;
      background: #f4f6fb;
      font-family: "Libre Baskerville", serif;
      color: #1a1a1a;
    }

    .notices-wrapper {
      max-width: 1000px;
      margin: auto;
      padding: 32px 20px 60px;
    }

    /* ================= HEADER ================= */
    .dashboard-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .dashboard-header h1 {
      font-family: "Cinzel", serif;
      font-size: 28px;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .dashboard-header .subhead {
      font-size: 14px;
      color: #555;
    }

    /* ================= SECTION ================= */
    .dashboard-section {
      background: #ffffff;
      border-radius: 12px;
      padding: 26px 28px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.08);
    }

    .dashboard-section h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 10px;
    }

    /* ================= APPROVAL CARD ================= */
    .approval-card {
      border-left: 5px solid #1f3a8a;
      background: #fafafa;
      border-radius: 8px;
      padding: 20px 22px;
      margin-bottom: 26px;
    }

    .approval-card h3 {
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: bold;
    }

    .approval-card .meta {
      font-size: 13px;
      color: #666;
      margin-bottom: 14px;
    }

    .content-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 14px 16px;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 18px;
      white-space: pre-wrap;
    }

    /* ================= ACTIONS ================= */
    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .actions button {
      padding: 10px 14px;
      border-radius: 6px;
      border: none;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .actions button:hover {
      opacity: 0.92;
    }

    .approve {
      background: #1f3a8a;
      color: #ffffff;
    }

    .edit {
      background: #f59e0b;
      color: #1a1a1a;
    }

    .sendback {
      background: #64748b;
      color: #ffffff;
    }

    .danger {
      background: #b91c1c;
      color: #ffffff;
    }

    /* ================= EMPTY / MUTED ================= */
    .muted {
      color: #666;
      font-size: 14px;
    }

    /* ================= FOOTER ================= */
    .dashboard-footer {
      margin-top: 40px;
      text-align: center;
    }

    .dashboard-footer .logout {
      background: transparent;
      border: 1px solid #cbd5f5;
      padding: 8px 18px;
      border-radius: 6px;
      font-family: inherit;
      cursor: pointer;
    }
  </style>
</head>

<body>

<main class="notices-wrapper">

  <!-- HEADER -->
  <header class="dashboard-header">
    <h1>Secretariat</h1>
    <p class="subhead">Announcement Approvals</p>
  </header>

  <!-- APPROVAL LIST -->
  <section class="dashboard-section">
    <h2>Pending Announcements</h2>

    <div id="approvalList">
      <p class="muted">Loading pending announcements…</p>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="dashboard-footer">
    <button class="logout" onclick="window.location.href='dashboard.html'">
      ← Back to Dashboard
    </button>
  </footer>

</main>

<!-- Approval logic -->
<script type="module" src="js/announcements-approval.js"></script>

</body>
</html>
