<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit & Publish Announcement</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Libre+Baskerville&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/secretariat.css">
</head>

<body>

<main class="notices-wrapper">

  <header class="dashboard-header">
    <h1>Edit Announcement</h1>
    <p class="subhead">Super Admin Approval</p>
  </header>

  <section class="dashboard-section">

    <label class="field-label">Announcement Content</label>
    <textarea
      id="content"
      class="input-field"
      rows="5"
      maxlength="180"
    ></textarea>

    <div class="char-row">
      <span id="charCount">0 / 180</span>
    </div>

    <label class="field-label">Expiry (optional)</label>
    <input
      type="datetime-local"
      id="expiresAt"
      class="input-field"
    />

    <div class="actions-row">
      <button class="primary-action" id="publishBtn">
        Save & Publish
      </button>

      <button class="secondary-action" onclick="goBack()">
        Cancel
      </button>
    </div>

  </section>

</main>

<script type="module" src="js/announcements-edit.js"></script>
</body>
</html>
