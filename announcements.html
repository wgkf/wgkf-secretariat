<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WGKF Secretariat – Announcements</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Libre+Baskerville&display=swap" rel="stylesheet">

  <!-- Shared admin styles -->
  <link rel="stylesheet" href="css/secretariat.css">
  <link rel="stylesheet" href="css/announcements.css">
</head>

<body>

<main class="notices-wrapper">

  <!-- HEADER -->
  <header class="dashboard-header">
    <h1>Secretariat</h1>
    <p class="subhead">Announcement Management</p>
  </header>

 <!-- CREATE ANNOUNCEMENT -->
<section class="dashboard-section">

  <h2>New Announcement</h2>
  <p class="muted">
    Draft an announcement and send it for Super Admin approval.
    <br>Maximum 180 characters.
  </p>

  <textarea
    id="announcementText"
    class="input-field"
    rows="4"
    maxlength="180"
    placeholder="Write announcement here…"
  ></textarea>

  <div class="char-row">
    <span id="charCount">0 / 180</span>
  </div>

  <div class="checkbox-row">
    <label class="checkbox">
      Auto-expire announcement
      <input type="checkbox" id="setExpiry">
    </label>
  </div>

  <div id="expiryBox" class="hidden">
    <label class="field-label">Expiry Date & Time</label>
    <input type="datetime-local" id="expiryTime" class="input-field" />
  </div>

  <div class="action-row">
    <button class="secondary-action" id="saveDraft">
      Save Draft
    </button>

    <button class="primary-action" id="sendForApproval">
      Send for Approval
    </button>
  </div>

</section>

  <!-- EXISTING ANNOUNCEMENTS -->
  <section class="dashboard-section">
    <h2>Active Announcements</h2>

    <ul id="announcementList" class="simple-list">
      <li class="muted">Loading announcements…</li>
    </ul>
  </section>

  <!-- FOOTER -->
  <footer class="dashboard-footer">
   <button class="logout" onclick="window.location.href='dashboard.html'">
  Back to Dashboard
</button>

  </footer>

</main>

<!-- Auth guard -->
<script type="module" src="js/auth.js"></script>

<!-- Announcement logic -->
<script type="module" src="js/announcements.js"></script>

</body>
</html>
